<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Chef{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ base }}static/style.css">
<meta name="theme-color" content="#1f1b18">
<script>try{if(localStorage.getItem("chef.theme")==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="{{ base }}static/icon.svg">
<link rel="apple-touch-icon" href="{{ base }}static/icon.svg">
</head>
<body>
<nav class="nav no-print">
  <a href="{{ base }}index.html" class="brand"><img src="{{ base }}static/icon.svg" alt="" class="brand-icon"> Chef</a>
  <a href="{{ base }}index.html">Recipes</a>
  <a href="{{ base }}shop.html">List <span id="nav-count" class="pill"></span></a>
  <a href="{{ base }}menus.html">Menus</a>
  <a href="{{ base }}nutrition.html">Nutrition</a>
  {% if site and site.submission_email %}<a href="{{ base }}contribute.html">Send a recipe</a>{% endif %}
  <button id="theme-toggle" class="no-print" title="Light / dark" aria-label="Toggle dark mode">☾</button>
</nav>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="no-print muted small">Built {{ built }} · <a href="https://github.com/ThomasFamilyBot/chef">source</a></footer>
<script>window.CHEF_CFG = {{ {"api": (site.lists_api or ""), "lists": (site.lists or ["Household"])}|tojson }};</script>
<script src="{{ base }}static/units.js"></script>
<script src="{{ base }}static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
