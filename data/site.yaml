# Site and household settings.
# scripts/build.py reads the site keys; Claude reads the rest (CLAUDE.md and the skills point here).
# Change any of this by telling Claude, or edit the file by hand. Everything here is visible to anyone
# who looks at the repository, so no passwords, ever.

setup_done: true                 # false on a brand-new copy: Claude then follows SETUP.md first

# --- names
site_name: Chef                  # shown in the site's top bar and page titles
bot_name: ChefBot                # what the household calls Claude in this project
household: the Thomas family
house_taste: "high-protein mains, bold flavors (Korean, Italian-American, BBQ, Nashville hot), projects for weekends, sous-vide and smoker friendly, ice creams for dessert"
# equipment: kitchen gear whose size or model changes how a recipe is scaled or written. Claude reads it; the site does not.
equipment:
  - name: KitchenAid Ice Cream Maker attachment
    detail: "2 quart freeze bowl (stand mixer attachment). One churn makes at most 2 quarts of finished ice cream; the bowl has to refreeze (KitchenAid says 24 hours) between churns."
  - name: Ice cream containers
    detail: "Quart size. Write packing steps for quart containers (a 1 1/2 quart batch goes into 2 of them), not pints or one big tub."

# --- GitHub
repo: ThomasFamilyBot/chef       # owner/repository
site_url: https://thomasfamilybot.github.io/Chef/

# --- shopping lists: one list per name; these names show on the public site
lists:
  - Ahin
  - Jenn
  - Andrea
# lists_api: the Apps Script web-app URL (see docs/SHARED_LISTS.md); empty = each phone keeps its own lists.
lists_api: "https://script.google.com/macros/s/AKfycbz-DRGBlGvj0H4haTfkUzh6SPKe4QmTaOqRwAliWKnQq9NhA4dQMWV43GsVkGP6widwAw/exec"
# docs_api: the Apps Script web-app URL that rewrites recipe Google Docs in place (see docs/DOCS_API.md); empty = use the drive-export skill's slower routes.
docs_api: ""

# --- Ask ChefBot: the Ask page opens a new Claude session with the question typed in (the recommend skill answers it)
ask:
  url: "https://claude.ai/code/new"           # empty hides the question box; published answers still show
  prompt: "ChefBot, recommend: "               # put in front of the question
  hint: "In Claude, pick the workspace environment (Remote Control, the Mini) before you send."
  fetch_command: "node /Users/thomasfamilybot/workspace/tools/fetch-page.mjs"                     # optional: a local command that saves a web page's text, for sites that block plain fetching

# --- Recipes from videos (Instagram reels, TikTok, YouTube): optional commands on the household's own computer.
# Claude runs them with the video's link (recipe-intake skill, "Video"). Leave empty if the tools are not installed.
video:
  frames_command: "node /Users/thomasfamilybot/workspace/tools/video-frames.mjs"       # saves still frames of the video as contact sheets, to read what is shown
  transcribe_command: "bash /Users/thomasfamilybot/workspace/tools/transcribe-video.sh"   # saves a transcript of what is said (runs on the computer; nothing is uploaded)

# --- Google (all optional; see SETUP.md for the add-ons that fill these in)
google_account: ahinthomas@gmail.com   # owns the Drive folders, the Docs, the lists sheet and its Apps Script, and the Claude connectors
summary_email: ahinthomas@gmail.com    # recipe-inbox runs send their summary here
# submission_email: the public address friends send recipes to (shown on the Send a recipe page). Leave empty to hide the page.
submission_email: ""
inbox_folder_url: https://drive.google.com/drive/folders/1yDhgpXc_rXGO5I7U_QmIm8QRqL62JPo9
google:
  docs_folder: {name: Converted Recipies, id: 1r7iPvPCANIL6WebFZSeCiCyS0Kr57bdN}   # where Google Doc copies of recipes go
  docs_subfolders:
    - {name: Converted Pasta Sauce, id: 1XPi5GTWUkroQ27qPC6YihXKenPeX-M3C, use_for: pasta sauces}
  inbox_folder_id: 1yDhgpXc_rXGO5I7U_QmIm8QRqL62JPo9
  inbox_processed_folder_id: 1couCHZAIIDFYrJINp-GEhUlrVZLSbndv
  gmail_label_done_id: Label_67       # Gmail label Chef/Done
  gmail_label_waiting_id: Label_68    # Gmail label Chef/Waiting
